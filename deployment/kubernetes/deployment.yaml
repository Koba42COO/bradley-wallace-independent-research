# UPG Quantum Production System - Kubernetes Deployment
# ======================================================
# Production Kubernetes manifests for deploying the
# UPG Quantum Orchestrator with high availability.
#
# Author: Bradley Wallace (COO Koba42)
# Framework: Universal Prime Graph Protocol φ.1

---
apiVersion: v1
kind: Namespace
metadata:
  name: upg-quantum
  labels:
    app.kubernetes.io/name: upg-quantum
    app.kubernetes.io/version: "1.0.0"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upg-config
  namespace: upg-quantum
data:
  # UPG Mathematical Constants
  UPG_PHI: "1.618033988749895"
  UPG_DELTA: "2.414213562373095"
  UPG_CONSCIOUSNESS: "0.79"
  UPG_EXPLORATORY: "0.21"
  UPG_REALITY_DISTORTION: "1.1808"
  UPG_QUANTUM_BRIDGE: "173.41772151898732"
  
  # Backend Configuration
  ENABLE_LOCAL_SIMULATOR: "true"
  ENABLE_DWAVE: "false"
  ENABLE_IBM: "false"
  ENABLE_AWS: "false"
  
  # Orchestrator Settings
  MAX_CONCURRENT_TASKS: "10"
  DEFAULT_TIMEOUT: "300"
  SELECTION_STRATEGY: "optimal"
  
  # Logging
  LOG_LEVEL: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: upg-secrets
  namespace: upg-quantum
type: Opaque
stringData:
  # Quantum Backend API Keys (base64 encoded in production)
  DWAVE_API_TOKEN: ""
  IBM_QUANTUM_TOKEN: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upg-orchestrator
  namespace: upg-quantum
  labels:
    app: upg-orchestrator
    framework: upg-protocol-phi-1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: upg-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: upg-orchestrator
        framework: upg-protocol-phi-1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: upg-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: orchestrator
          image: upg-quantum/orchestrator:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: upg-config
            - secretRef:
                name: upg-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: results
              mountPath: /app/results
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: upg-results-pvc
        - name: logs
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - upg-orchestrator
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: upg-orchestrator
  namespace: upg-quantum
  labels:
    app: upg-orchestrator
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: upg-orchestrator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: upg-orchestrator
  namespace: upg-quantum

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: upg-orchestrator-hpa
  namespace: upg-quantum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: upg-orchestrator
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: quantum_tasks_pending
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: upg-results-pvc
  namespace: upg-quantum
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upg-orchestrator-ingress
  namespace: upg-quantum
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - quantum.upg.example.com
      secretName: upg-quantum-tls
  rules:
    - host: quantum.upg.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: upg-orchestrator
                port:
                  number: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: upg-orchestrator-pdb
  namespace: upg-quantum
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: upg-orchestrator

